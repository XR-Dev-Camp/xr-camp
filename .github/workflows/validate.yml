name: Validate

# Enforces the structure every project must follow, and guards the
# line between what is public and what must never be committed. Both failures are invisible in ordinary code review,
# which is why they are mechanical.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Project structure and lesson IDs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate every project.json
        run: node scripts/validate-projects.mjs
      - name: Check the generated READMEs match catalog.json
        run: node scripts/build-readmes.mjs --check

  secrets:
    name: Secret and private-data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI, pinned, scanning the whole history. (The gitleaks
      # action scans only the pushed range, which breaks on a first push.)
      - name: Scan history for credentials
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose .

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # 403 is accepted because many news and publisher sites refuse bots.
          # The Women to Know roster is research notes full of such sites, so
          # its sources are checked by editors before publication instead.
          args: >-
            --no-progress --exclude-loopback --max-retries 3 --timeout 30
            --accept 200,202,206,403,429
            --exclude-path docs/en/women-to-know.md
            '**/*.md'
          fail: true

  accessibility:
    name: Accessibility audit of reference solutions
    runs-on: ubuntu-latest
    # A normal run takes about 3 minutes; a hung browser must not block CI.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pa11y
        run: npm install --no-save pa11y@8
      - name: Audit every completed/index.html
        # A reference solution is what learners copy. An inaccessible one
        # teaches inaccessibility at scale, so this gate is non-negotiable.
        # pa11y cannot see inside a 3D canvas: a scene can pass here and still be
        # unusable. The manual 3D/XR checks (docs/en/xr-accessibility.md) cover
        # that gap, and validate-projects.mjs requires them to be declared.
        run: |
          status=0
          # --no-sandbox: GitHub's Ubuntu runners block Chrome's sandbox.
          # SwiftShader: runners have no GPU, and 3D lessons need WebGL to load.
          echo '{ "chromeLaunchConfig": { "args": ["--no-sandbox", "--use-angle=swiftshader", "--enable-unsafe-swiftshader"] }, "timeout": 120000 }' > /tmp/pa11y.json
          for f in $(find . -path '*/completed/index.html' | sort); do
            echo "--- $f"
            timeout 180 npx pa11y --config /tmp/pa11y.json --standard WCAG2AA --reporter cli "file://$PWD/${f#./}" || status=1
          done
          exit $status
