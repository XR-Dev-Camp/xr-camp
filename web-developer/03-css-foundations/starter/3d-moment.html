<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D moment: one colour system for 2D and 3D - Riverside Community Centre</title>
  <link rel="stylesheet" href="styles.css">
  <!-- A-Frame, pinned to the version in versions.json. -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    /* The frame around the scene uses the same tokens as the rest of the site. */
    .scene-frame {
      padding: var(--space-3);
      background: var(--color-band);
      border: 4px solid var(--color-primary);
      border-radius: var(--radius);
    }
    a-scene { display: block; width: 100%; height: 18rem; }
  </style>
</head>
<body>
  <a href="#main">Skip to main content</a>
  <header>
    <p><a href="index.html">Riverside Community Centre</a></p>
  </header>

  <main id="main">
    <h1>One colour system for 2D and 3D</h1>
    <p>The shapes below take their colours from the same custom properties as this page. Change <code>--color-primary</code> in <code>styles.css</code>, reload, and both change together.</p>

    <figure class="scene-frame">
      <a-scene embedded xr-mode-ui="enabled: false" loading-screen="enabled: false">
        <a-sky data-token="--color-bg"></a-sky>
        <a-box position="-1.2 1.4 -3.5" rotation="15 30 0" data-token="--color-primary"></a-box>
        <a-sphere position="0 1.4 -4" radius="0.6" data-token="--color-accent"></a-sphere>
        <a-cylinder position="1.2 1.1 -3.5" radius="0.4" height="1" data-token="--color-primary-dark"></a-cylinder>
      </a-scene>
      <figcaption id="scene-description">A box in the site's primary purple, a sphere in its accent pink, and a cylinder in its dark purple, on the page's background colour. Nothing moves.</figcaption>
    </figure>

    <p><a href="index.html">Back to the home page</a></p>
  </main>

  <script>
    // Read each shape's colour from the stylesheet's custom properties.
    // getComputedStyle gives us the values the browser actually uses.
    const tokens = getComputedStyle(document.documentElement);
    for (const el of document.querySelectorAll('[data-token]')) {
      el.setAttribute('color', tokens.getPropertyValue(el.dataset.token).trim());
    }
  </script>
</body>
</html>
