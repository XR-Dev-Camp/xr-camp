<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D moment: audit this scene - XR Camp</title>
  <!--
    WARNING FOR LEARNERS: this scene is deliberately inaccessible.
    Audit it like the events page, then fix it. See the lesson guide.
  -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    body { max-width: 50rem; margin: 0 auto; padding: 1rem; font-family: system-ui, sans-serif; color: #1b1b1f; background: #fdfcf8; }
    a-scene { display: block; width: 100%; height: 20rem; }
  </style>
</head>
<body>
  <h1>Our 3D logo</h1>
  <a-scene embedded xr-mode-ui="enabled: false" loading-screen="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <a-sky color="#eef4ff"></a-sky>
    <a-box id="logo" class="clickable" position="0 1.5 -3" color="#5b2a86"
           animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear"></a-box>
  </a-scene>

  <script>
    const colours = ['#5b2a86', '#1f8a8a', '#b0245a', '#e0a526'];
    let i = 0;
    document.getElementById('logo').addEventListener('click', (event) => {
      i = (i + 1) % colours.length;
      event.target.setAttribute('color', colours[i]);
    });
  </script>
</body>
</html>
