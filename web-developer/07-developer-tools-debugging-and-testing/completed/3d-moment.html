<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D moment: the debugged scene - XR Camp reference solution</title>
  <!-- A-Frame, pinned to the version in versions.json. -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    body { max-width: 50rem; margin: 0 auto; padding: 1rem; font-family: system-ui, sans-serif; line-height: 1.6; color: #1b1b1f; background: #fdfcf8; }
    a-scene { display: block; width: 100%; height: 20rem; }
  </style>
</head>
<body>
  <main>
    <h1>The lantern garden</h1>
    <p id="scene-description">Three paper lanterns, purple, gold, and teal, hang in a row against a night sky, with twenty tiny fireflies around them. Nothing moves.</p>
    <a-scene embedded xr-mode-ui="enabled: false" loading-screen="enabled: false">
      <!-- Fix 1: "#1b1b3" had only five digits; a colour needs six (or three). -->
      <a-sky color="#1b1b3a"></a-sky>
      <a-sphere position="-1.2 1.6 -3" radius="0.4" color="#5b2a86"></a-sphere>
      <!-- Fix 2: z was 3, which is BEHIND the camera. In front of it, z is negative. -->
      <a-sphere position="0 1.6 -3" radius="0.4" color="#e0a526"></a-sphere>
      <a-sphere position="1.2 1.6 -3" radius="0.4" color="#1f8a8a"></a-sphere>
      <a-entity id="fireflies"></a-entity>
    </a-scene>
  </main>

  <script>
    // Fix 3: the fireflies were added every 50 milliseconds, forever: twenty a
    // second, never removed, until the page slowed to a crawl. Twenty, once,
    // look the same and cost almost nothing.
    const fireflies = document.getElementById('fireflies');
    for (let i = 0; i < 20; i++) {
      const light = document.createElement('a-sphere');
      light.setAttribute('radius', 0.01);
      light.setAttribute('color', '#fff6c2');
      light.setAttribute('position', `${Math.random() * 4 - 2} ${Math.random() * 2 + 0.8} -3.5`);
      fireflies.append(light);
    }
  </script>
</body>
</html>
