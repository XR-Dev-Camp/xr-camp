<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235b2a86'/%3E%3Ctext x='16' y='21' font-size='13' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EXR%3C/text%3E%3C/svg%3E">
  <title>3D moment: debug this scene - XR Camp</title>
  <!--
    WARNING FOR LEARNERS: this scene is broken on purpose, in three ways.
    Use the A-Frame Inspector and your browser's Performance panel to find why.
  -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    body { max-width: 50rem; margin: 0 auto; padding: 1rem; font-family: system-ui, sans-serif; line-height: 1.6; color: #1b1b1f; background: #fdfcf8; }
    a-scene { display: block; width: 100%; height: 20rem; }
  </style>
</head>
<body>
  <main>
    <h1>The lantern garden</h1>
    <p id="scene-description">Three paper lanterns, purple, gold, and teal, hang in a row against a night sky. Nothing moves.</p>
    <a-scene embedded xr-mode-ui="enabled: false" loading-screen="enabled: false">
      <a-sky color="#1b1b3"></a-sky>
      <a-sphere position="-1.2 1.6 -3" radius="0.4" color="#5b2a86"></a-sphere>
      <a-sphere position="0 1.6 3" radius="0.4" color="#e0a526"></a-sphere>
      <a-sphere position="1.2 1.6 -3" radius="0.4" color="#1f8a8a"></a-sphere>
      <a-entity id="fireflies"></a-entity>
    </a-scene>
  </main>

  <script>
    // Fireflies: tiny lights around the lanterns.
    const fireflies = document.getElementById('fireflies');
    setInterval(() => {
      const light = document.createElement('a-sphere');
      light.setAttribute('radius', 0.01);
      light.setAttribute('color', '#fff6c2');
      light.setAttribute('position', `${Math.random() * 4 - 2} ${Math.random() * 2 + 0.8} -3.5`);
      fireflies.append(light);
    }, 50);
  </script>
</body>
</html>
