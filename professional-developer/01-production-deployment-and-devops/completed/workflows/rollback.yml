# Example GitHub Actions workflow: roll back to a previous release.
#
# Copy this file to `.github/workflows/rollback.yml` at the root of your own
# repository, alongside `deploy.yml` (see the comment at the top of that
# file). A rollback does not "undo" anything on GitHub Pages: it simply
# builds and redeploys the exhibit exactly as it was at an earlier tag, so
# the live site matches that tag again.
#
# To run it: open the Actions tab, choose "Rollback", "Run workflow", and
# type the tag to redeploy (for example v1.2.0). Only tags you have already
# released with deploy.yml are valid.

name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The previous release tag to redeploy, for example v1.2.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build the chosen tag
    runs-on: ubuntu-latest
    steps:
      # The only difference from deploy.yml's build job: `ref` checks out the
      # requested tag instead of the branch that triggered the run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app

  approve:
    name: Await manual approval
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    steps:
      - run: echo "Approved. Rolling back to ${{ inputs.tag }}."

  deploy:
    name: Redeploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: approve
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  note:
    name: Record the rollback
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Add a note to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        # `gh release edit` appends to an existing release's notes rather
        # than creating a new one, so the release history stays honest about
        # what is actually live right now.
        run: |
          NOTES="$(gh release view "${{ inputs.tag }}" --json body -q .body)"
          gh release edit "${{ inputs.tag }}" --notes "$NOTES

          ---
          **Rolled back into production on $(date -u +%Y-%m-%d) by ${{ github.actor }}.**"
