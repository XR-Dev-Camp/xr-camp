# Example GitHub Actions workflow: release pipeline for the virtual exhibit.
#
# This file only RUNS from a repository's own `.github/workflows/` folder, so
# it lives here as an example for you to copy. To use it:
#   1. Copy this file to `.github/workflows/deploy.yml` at the root of your
#      own repository (the exhibit's files — `app/` here — go at that root).
#   2. In your repository, open Settings -> Pages, and set Source to
#      "GitHub Actions".
#   3. Open Settings -> Environments, create an environment named
#      "production", and tick "Required reviewers", adding yourself (or a
#      teammate). That single setting is what turns the `approve` job below
#      into a manual approval gate: GitHub Actions cannot request that
#      approval through YAML alone, only through an environment's protection
#      rules.
#
# Verify before you rely on this file: action versions move. Check each
# action's own "Releases" page on GitHub for its current major version
# before you pin it in a real project.

name: Deploy exhibit

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Least privilege: only the deploy job needs to write to Pages.
permissions:
  contents: read

jobs:
  # Job 1: validate. Catches a broken build before anything is deployed.
  validate:
    name: Validate HTML and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate HTML
        # html-validate is an offline HTML5 linter: no network calls, no
        # accounts. Pin its major version and re-check it occasionally.
        # A few of its default style rules fight this project's deliberate
        # accessibility choices, so they are turned off: role="list" on a
        # styled <ul>/<ol> restores its list semantics for older Safari
        # VoiceOver (a documented WCAG technique, not a mistake); a landmark
        # built with role="region" instead of <section> is used where a
        # generic container needs a label; and the page titles are
        # descriptive on purpose, longer than the rule's 70-character
        # default.
        run: |
          npm install --no-save html-validate@11
          npx html-validate --rule "no-redundant-role:off" --rule "prefer-native-element:off" --rule "long-title:off" 'app/**/*.html'
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --exclude-loopback --max-retries 3 --timeout 30
            --accept 200,202,206,403,429
            'app/**/*.html'
          fail: true

  # Job 2: accessibility. A headless audit of the reference solution, exactly
  # as this repository's own .github/workflows/validate.yml audits every
  # completed/index.html (see the README's case study).
  accessibility:
    name: Accessibility audit
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pa11y
        run: npm install --no-save pa11y@8
      - name: Audit the exhibit
        run: |
          echo '{ "chromeLaunchConfig": { "args": ["--no-sandbox", "--use-angle=swiftshader", "--enable-unsafe-swiftshader"] }, "timeout": 120000 }' > /tmp/pa11y.json
          npx pa11y --config /tmp/pa11y.json --standard WCAG2AA "file://$PWD/app/index.html"
          # pa11y reads the rendered DOM: it can see every button, label, and
          # live region here, but it cannot see inside the WebGL canvas. That
          # gap is why tests/checklist.md has a "3D and XR (manual)" section:
          # a person must still check the scene itself.

  # Job 3: build. Packages the site as a Pages artifact. No build tools are
  # needed here because the exhibit is plain HTML/CSS/JS; a framework project
  # would run its build command first and upload that output folder instead.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: accessibility
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app

  # Job 4: wait for a human. The "production" environment (configured in
  # Settings -> Environments, step 3 above) pauses the run here until a
  # required reviewer approves it in the Actions tab.
  approve:
    name: Await manual approval
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    steps:
      - run: echo "Approved. Deploying to GitHub Pages."

  # Job 5: deploy, using GitHub's own Pages actions. The "github-pages"
  # environment is created automatically the first time this runs, and its
  # URL appears on the deployment in the repository's Environments tab.
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: approve
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Job 6: release notes. `gh release create` is the GitHub CLI, already
  # installed on every runner: no extra action, account, or API key needed.
  # `--generate-notes` builds notes from the commits and merged pull requests
  # since the previous tag.
  release:
    name: Publish release notes
    runs-on: ubuntu-latest
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
