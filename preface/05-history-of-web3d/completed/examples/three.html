<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The box in three.js</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1b1b1f; background: #fdfcf8; }
    p { margin: 0.5rem; }
    canvas { display: block; width: 100%; height: 16rem; }
  </style>
  <!-- three.js, pinned in versions.json. -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js" } }
  </script>
</head>
<body>
  <p id="scene-description">A purple cube, turned so that three of its faces show, on a pale background. Nothing moves.</p>
  <canvas id="scene" aria-describedby="scene-description"></canvas>

  <script type="module">
    // Imperative: you give the computer step-by-step instructions for HOW to draw.
    import * as THREE from 'three';

    const canvas = document.querySelector('#scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#fdfcf8');

    const camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.z = 3;

    // Without lights, a lit material is black. A-Frame and X3DOM add default lights for you.
    scene.add(new THREE.AmbientLight('#ffffff', 1));
    const sun = new THREE.DirectionalLight('#ffffff', 2);
    sun.position.set(2, 3, 4);
    scene.add(sun);

    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: '#5b2a86' }),
    );
    box.rotation.set(0.5, 0.6, 0);
    scene.add(box);

    // Nothing moves, so one drawing is enough: no animation loop.
    renderer.render(scene, camera);
  </script>
</body>
</html>
