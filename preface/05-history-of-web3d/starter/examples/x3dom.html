<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235b2a86'/%3E%3Ctext x='16' y='21' font-size='13' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EXR%3C/text%3E%3C/svg%3E">
  <title>The box in X3D (X3DOM)</title>
  <!-- X3DOM lets a browser show X3D, the ISO standard, directly inside HTML. Pinned in versions.json. -->
  <script src="https://www.x3dom.org/download/1.8.3/x3dom.js"></script>
  <link rel="stylesheet" href="https://www.x3dom.org/download/1.8.3/x3dom.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1b1b1f; background: #fdfcf8; }
    p { margin: 0.5rem; }
    x3d { display: block; width: 100%; height: 16rem; border: none; }
  </style>
  <style>
    /* X3DOM's own "WebGL is not supported" messages: make them readable. */
    #x3dom-nox3d, #x3dom-create-init-failed { background: #ffffff !important; color: #1b1b1f !important; }
    #x3dom-nox3d p, #x3dom-create-init-failed p { color: #1b1b1f !important; background: #ffffff !important; }
    #x3dom-nox3d a, #x3dom-create-init-failed a { color: #3f1d5e !important; background: #ffffff !important; }
  </style>
</head>
<body>
  <p id="scene-description">A purple cube, turned so that three of its faces show, on a pale background. Nothing moves.</p>

  <!-- Declarative: you describe WHAT is in the scene, and X3DOM works out how to draw it. -->
  <x3d>
    <scene>
      <background skyColor="0.99 0.99 0.97"></background>
      <transform rotation="1 1 0 0.6">
        <shape>
          <appearance>
            <material diffuseColor="0.36 0.16 0.53"></material>
          </appearance>
          <box size="1.5 1.5 1.5"></box>
        </shape>
      </transform>
    </scene>
  </x3d>
</body>
</html>
