<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235b2a86'/%3E%3Ctext x='16' y='21' font-size='13' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EXR%3C/text%3E%3C/svg%3E">
  <title>Capstone Prototype - XR Camp starter</title>
  <link rel="stylesheet" href="../completed/styles.css">
  <script>
    window.__reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
        "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header><p>XR Camp · Capstone · Stage 3: Capstone Prototype</p></header>
  <main>
    <h1>Your prototype</h1>
    <p>Read <a href="prototype-plan.md">prototype-plan.md</a> first, then complete the four TODOs in <code>js/main.js</code>.</p>

    <div class="lab">
      <section class="view" aria-labelledby="view-heading">
        <h2 id="view-heading">The prototype</h2>
        <div class="canvas-box" id="canvas-box"></div>

        <h3>Scene description</h3>
        <p id="scene-description" class="scene-text">Not built yet.</p>

        <h3>The 2D twin</h3>
        <ul class="exhibit-list" id="exhibit-list" role="list"></ul>
      </section>

      <div class="controls" role="region" aria-label="Prototype controls">
        <fieldset>
          <legend>Look around</legend>
          <ul class="view-buttons" role="list">
            <li><button type="button" id="turn-left">Turn left</button></li>
            <li><button type="button" id="turn-right">Turn right</button></li>
          </ul>
        </fieldset>
        <fieldset>
          <legend>Animation</legend>
          <p><button type="button" id="pause-toggle" aria-pressed="false">Pause animation</button></p>
        </fieldset>
      </div>
    </div>
  </main>
</body>
</html>
